<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: parent(~{::section}, ~{::title}, ~{::script})}">
<head>
    <title>Login - Sanitization Management System</title>
</head>
<body>
<section>
    <div class="min-h-[calc(100vh-4rem)] flex items-center justify-center bg-gray-50 dark:bg-gray-900 py-12 px-4">
        <div class="w-full max-w-md">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="mx-auto flex items-center justify-center
                            w-16 h-16 rounded-full
                            bg-blue-100 dark:bg-blue-900/40 mb-4">
                    <i class="fa-solid fa-user-lock text-2xl text-blue-600 dark:text-blue-400"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Welcome Back</h1>
                <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
                    Login to your Sanitization Management account
                </p>
            </div>

            <!-- Login Card -->
            <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-sm p-6 sm:p-8">
                <!-- LOGIN FORM -->
                <form id="loginForm" novalidate>
                    <!-- Username -->
                    <div class="mb-5">
                        <label for="username" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Username
                        </label>

                        <div class="relative">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                                <i class="fa-solid fa-user text-gray-400"></i>
                            </div>
                            <input type="text" id="username" name="username" autocomplete="username" placeholder="Enter your username" required
                                   class="bg-gray-50 border border-gray-300
                                          text-gray-900 text-sm rounded-lg
                                          focus:ring-blue-500 focus:border-blue-500
                                          block w-full ps-10 p-3
                                          dark:bg-gray-700 dark:border-gray-600
                                          dark:text-white
                                          dark:placeholder-gray-400">
                        </div>
                        <p id="usernameError" class="hidden mt-1 text-sm text-red-600 dark:text-red-400"></p>
                    </div>

                    <!-- Password -->
                    <div class="mb-5">
                        <div class="flex items-center justify-between mb-2">
                            <label for="password"
                                   class="text-sm font-medium text-gray-900 dark:text-white">Password
                            </label>

                            <a href="#" id="forgotPassword"
                               class="text-sm text-blue-600 hover:underline dark:text-blue-400">Forgot Password?
                            </a>
                        </div>

                        <div class="relative">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                                <i class="fa-solid fa-lock text-gray-400"></i>
                            </div>
                            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required
                                   class="bg-gray-50 border border-gray-300
                                          text-gray-900 text-sm rounded-lg
                                          focus:ring-blue-500 focus:border-blue-500
                                          block w-full ps-10 pe-12 p-3
                                          dark:bg-gray-700 dark:border-gray-600
                                          dark:text-white
                                          dark:placeholder-gray-400">

                            <!-- Show / Hide Password -->
                            <button type="button" id="togglePassword"
                                    class="absolute inset-y-0 end-0 flex items-center
                                           pe-3 text-gray-400 hover:text-gray-600
                                           dark:hover:text-gray-200">
                                <i id="passwordIcon" class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                        <p id="passwordError" class="hidden mt-1 text-sm text-red-600 dark:text-red-400"></p>
                    </div>

                    <!-- Login Button -->
                    <button type="submit"
                            id="loginButton"
                            class="w-full inline-flex items-center justify-center
                                   gap-2 text-white bg-blue-600
                                   hover:bg-blue-700
                                   focus:ring-4 focus:ring-blue-300
                                   font-medium rounded-lg text-sm px-5 py-3
                                   disabled:opacity-60
                                   disabled:cursor-not-allowed">
                        <i id="loginButtonIcon" class="fa-solid fa-right-to-bracket"></i>
                        <span id="loginButtonText">Login</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
<!-- LOGIN SCRIPT -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        console.log("Login page loaded");
        const loginForm = document.getElementById("loginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const rememberInput = document.getElementById("remember");
        const loginButton = document.getElementById("loginButton");
        const loginButtonText = document.getElementById("loginButtonText");
        const loginButtonIcon = document.getElementById("loginButtonIcon");
        const togglePassword = document.getElementById("togglePassword");
        const passwordIcon = document.getElementById("passwordIcon");
        const usernameError = document.getElementById("usernameError");
        const passwordError = document.getElementById("passwordError");

        /*  SHOW / HIDE PASSWORD */
        togglePassword.addEventListener("click", function () {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                passwordIcon.classList.remove("fa-eye");
                passwordIcon.classList.add("fa-eye-slash");
            } else {
                passwordInput.type = "password";
                passwordIcon.classList.remove("fa-eye-slash");
                passwordIcon.classList.add("fa-eye");
            }
        });

        /* CLEAR VALIDATION ERROR */
        usernameInput.addEventListener("input", function () {
            usernameError.textContent = "";
            usernameError.classList.add("hidden");
            usernameInput.classList.remove("border-red-500", "focus:border-red-500");
        });

        passwordInput.addEventListener("input", function () {
            passwordError.textContent = "";
            passwordError.classList.add("hidden");
            passwordInput.classList.remove("border-red-500", "focus:border-red-500");
        });

        /*  LOGIN FORM */
        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            /* CLIENT SIDE VALIDATION */
            let valid = true;
            if (!username) {
                usernameError.textContent = "Username is required.";
                usernameError.classList.remove("hidden");
                usernameInput.classList.add("border-red-500", "focus:border-red-500");
                valid = false;
            }

            if (!password) {
                passwordError.textContent = "Password is required.";
                passwordError.classList.remove("hidden");
                passwordInput.classList.add("border-red-500", "focus:border-red-500");
                valid = false;
            }

            if (!valid) {
                return;
            }

            /* DISABLE LOGIN BUTTON */
            loginButton.disabled = true;
            loginButtonIcon.className = "fa-solid fa-spinner fa-spin";
            loginButtonText.textContent = "Logging in...";

            try {
                /* BACKEND LOGIN REQUEST */
                const response = await fetch("/api/auth/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        credentials: "same-origin",
                        body: JSON.stringify({username: username, password: password})
                    }
                );

                /* RESPONSE */
                let data = {};
                try {
                    data = await response.json();
                } catch (error) {
                    console.warn(
                        "Response does not contain JSON."
                    );
                }

                /* LOGIN FAILED */
                if (!response.ok) {
                    let errorMessage = "Invalid username or password.";
                    if (data.message) {
                        errorMessage = data.message;
                    }

                    if (data.error) {
                        errorMessage = data.error;
                    }
                    throw new Error(errorMessage);
                }

                /* LOGIN SUCCESS */
                console.log("Login successful:", data);

                await Swal.fire({
                    icon: "success",
                    title: "Login Successful",
                    text: "Welcome back, " + (data.name || username),
                    timer: 1200,
                    showConfirmButton: false
                });

                /* ADMIN DASHBOARD */
                window.location.href = "/admin";
            } catch (error) {
                console.error("Login error:", error);
                Swal.fire({
                    icon: "error",
                    title: "Login Failed",
                    text: error.message || "Invalid username or password."
                });
            } finally {
                loginButton.disabled = false;
                loginButtonIcon.className = "fa-solid fa-right-to-bracket";
                loginButtonText.textContent = "Login";
            }
        });

        /* FORGOT PASSWORD */
        document
            .getElementById("forgotPassword")
            .addEventListener("click", function (event) {
                event.preventDefault();
                Swal.fire({
                    icon: "info",
                    title: "Forgot Password?",
                    text: "Password recovery functionality will be available soon.",
                    confirmButtonText: "OK"
                });
            });
    });
</script>
</body>
</html>
