<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: parent(~{::section}, ~{::title},~{::script})}">
<head>
    <title>Register - Sanitization Management System</title>
</head>
<body>
<section>
    <div class="min-h-[calc(100vh-4rem)] flex items-center justify-center bg-gray-50 dark:bg-gray-900 py-10 px-4">
        <div class="w-full max-w-lg">
            <!-- Header -->
            <div class="text-center mb-7">
                <div class="mx-auto flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 dark:bg-blue-900/40 mb-4">
                    <i class="fa-solid fa-user-plus text-2xl text-blue-600 dark:text-blue-400"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Create Account</h1>
                <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">Register to request sanitization services</p>
            </div>

            <!-- Register Card -->
            <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-sm p-6 sm:p-8">
                <form>
                    <!-- Name -->
                    <div class="mb-4">
                        <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Full Name
                        </label>
                        <input type="text" id="name" placeholder="Enter your full name"
                               class="bg-gray-50 border border-gray-300
                                      text-gray-900 text-sm rounded-lg
                                      focus:ring-blue-500 focus:border-blue-500
                                      block w-full p-3
                                      dark:bg-gray-700 dark:border-gray-600
                                      dark:text-white">
                    </div>

                    <!-- Email -->
                    <div class="mb-4">
                        <label for="registerEmail" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Email Address
                        </label>
                        <input type="email" id="registerEmail" placeholder="Enter your email"
                               class="bg-gray-50 border border-gray-300
                                      text-gray-900 text-sm rounded-lg
                                      focus:ring-blue-500 focus:border-blue-500
                                      block w-full p-3
                                      dark:bg-gray-700 dark:border-gray-600
                                      dark:text-white">
                    </div>

                    <!-- Mobile -->
                    <div class="mb-4">
                        <label for="mobile"
                               class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Mobile Number
                        </label>

                        <input type="tel" id="mobile" placeholder="Enter your mobile number"
                               class="bg-gray-50 border border-gray-300
                                      text-gray-900 text-sm rounded-lg
                                      focus:ring-blue-500 focus:border-blue-500
                                      block w-full p-3
                                      dark:bg-gray-700 dark:border-gray-600
                                      dark:text-white">
                    </div>

                    <!-- Address -->
                    <div class="mb-4">
                        <label for="address" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Address
                        </label>

                        <textarea id="address" rows="3" placeholder="Enter your address"
                                  class="bg-gray-50 border border-gray-300
                                         text-gray-900 text-sm rounded-lg
                                         focus:ring-blue-500 focus:border-blue-500
                                         block w-full p-3
                                         dark:bg-gray-700 dark:border-gray-600
                                         dark:text-white">
                        </textarea>
                    </div>

                    <!-- Password -->
                    <div class="mb-4">
                        <label for="registerPassword" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Password
                        </label>
                        <input type="password" id="registerPassword" placeholder="Create a password"
                               class="bg-gray-50 border border-gray-300
                                      text-gray-900 text-sm rounded-lg
                                      focus:ring-blue-500 focus:border-blue-500
                                      block w-full p-3
                                      dark:bg-gray-700 dark:border-gray-600
                                      dark:text-white">
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-6">
                        <label for="confirmPassword" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Confirm Password
                        </label>
                        <input type="password"
                               id="confirmPassword"
                               placeholder="Confirm your password"
                               class="bg-gray-50 border border-gray-300
                                      text-gray-900 text-sm rounded-lg
                                      focus:ring-blue-500 focus:border-blue-500
                                      block w-full p-3
                                      dark:bg-gray-700 dark:border-gray-600
                                      dark:text-white">
                    </div>

                    <!-- Register -->
                    <button type="submit"
                            class="w-full inline-flex items-center justify-center
                                   gap-2 text-white bg-blue-600
                                   hover:bg-blue-700 focus:ring-4
                                   focus:ring-blue-300 font-medium
                                   rounded-lg text-sm px-5 py-3">
                        <i class="fa-solid fa-user-plus"></i>
                        Create Account
                    </button>
                </form>

                <!-- Login -->
                <div class="mt-6 text-center">
                    <p class="text-sm text-gray-500 dark:text-gray-400">
                        Already have an account?
                        <a th:href="@{/login}" class="font-medium text-blue-600 hover:underline dark:text-blue-400">Login
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
<script>
    console.log("register page loaded...");
</script>
</body>
</html>
