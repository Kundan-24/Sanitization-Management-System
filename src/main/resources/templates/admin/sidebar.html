<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="adminSidebar" id="admin-sidebar" class="fixed top-0 left-0 z-40 w-64 h-screen pt-16 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-700 shadow-sm transition-transform-translate-x-full lg:translate-x-0">
    <!-- ================= SIDEBAR HEADER ==================== -->
    <div class="px-5 py-5 border-b border-gray-200 dark:border-gray-700">
        <div class="flex items-center gap-3">
            <!-- Admin Icon -->
            <div class="relative
                        flex items-center justify-center
                        w-10 h-10
                        rounded-xl
                        bg-gradient-to-br
                        from-blue-600
                        via-blue-500
                        to-cyan-400
                        shadow-md
                        shadow-blue-500/20
                        ring-1
                        ring-blue-400/20">
                <i class="fa-solid fa-user-shield text-white text-lg"></i>
            </div>

            <!-- Admin Text -->
            <div class="leading-tight">
                <h2 class="text-sm font-bold text-gray-900 dark:text-white">Admin Role</h2>
                <p class="text-xs text-gray-500 dark:text-gray-400">Management Panel</p>
            </div>
        </div>
    </div>

    <!-- ======================= MENU ======================== -->
    <div class="px-3 py-5 overflow-y-auto h-[calc(100vh-137px)]">
        <ul class="space-y-1.5">
            <!-- ================= DASHBOARD ================= -->
            <li>
                <a th:href="@{/admin}"
                   class="group
                          flex items-center gap-3
                          px-4 py-3
                          rounded-xl
                          text-gray-700
                          dark:text-gray-300
                          hover:bg-blue-50
                          dark:hover:bg-blue-900/20
                          hover:text-blue-600
                          dark:hover:text-blue-400
                          transition-all duration-200">

                    <i class="fa-solid fa-gauge-high
                              w-5
                              text-center
                              text-gray-500
                              dark:text-gray-400
                              group-hover:text-blue-600
                              dark:group-hover:text-blue-400">
                    </i>
                    <span class="font-medium">Dashboard</span>
                </a>
            </li>

            <!-- ================= SERVICE ================= -->
            <li>
                <a th:href="@{/admin/add_services}"
                   class="group
                          flex items-center gap-3
                          px-4 py-3
                          rounded-xl
                          text-gray-700
                          dark:text-gray-300
                          hover:bg-blue-50
                          dark:hover:bg-blue-900/20
                          hover:text-blue-600
                          dark:hover:text-blue-400
                          transition-all duration-200">
                    <i class="fa-solid fa-briefcase
                              w-5
                              text-center
                              text-gray-500
                              dark:text-gray-400
                              group-hover:text-blue-600
                              dark:group-hover:text-blue-400">
                    </i>
                    <span class="font-medium">Service</span>
                </a>
            </li>

            <!-- ============== SANITIZATION REQUEST =========== -->
            <li>
                <a th:href="@{/admin/requests}"
                   class="group flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 dark:text-gray-300 hover:bg-blue-50 dark:hover:bg-blue-900/20 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-200">
                    <i class="fa-solid fa-file-circle-check w-5 text-center text-gray-500 dark:text-gray-400 group-hover:text-blue-600 dark:group-hover:text-blue-400"></i>
                    <span class="font-medium">Sanitization Request</span>
                </a>
            </li>

            <!-- ================= REPORT ==================== -->
            <li>
                <a th:href="@{/admin/report}" class="group flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 dark:text-gray-300 hover:bg-blue-50 dark:hover:bg-blue-900/20 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-200">
                    <i class="fa-solid fa-chart-column w-5 text-center text-gray-500 dark:text-gray-400 group-hover:text-blue-600 dark:group-hover:text-blue-400"></i>
                    <span class="font-medium">Report</span>
                </a>
            </li>

            <!-- ================= DIVIDER =================== -->
            <li class="py-3">
                <div class="border-t border-gray-200 dark:border-gray-700"></div>
            </li>

            <!-- ============== CHANGE PASSWORD =============== -->
            <li>
                <a th:href="@{/admin/change-password}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 dark:text-gray-300 hover:bg-blue-50 dark:hover:bg-blue-900/30 hover:text-blue-600 dark:hover:text-blue-400 transition">
                    <i class="fa-solid fa-key w-5 text-center"></i>
                    <span>Change Password</span>
                </a>
            </li>

            <!-- ================= LOGOUT ==================== -->
            <li>
                <a href="#" id="logoutBtn" class="group flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 dark:text-gray-300 hover:bg-red-50 dark:hover:bg-red-900/30 hover:text-red-600 dark:hover:text-red-400 transition-all duration-200">
                    <i class="fa-solid fa-right-from-bracket w-5 text-center text-gray-500 dark:text-gray-400 group-hover:text-red-600 dark:group-hover:text-red-400"></i>
                    <span class="font-medium">Logout</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- ================= LOGOUT SCRIPT ================= -->
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const logoutBtn = document.getElementById("logoutBtn");
                if (!logoutBtn) {
                    return;
                }
                logoutBtn.addEventListener("click", async function (event) {
                    event.preventDefault();
                    const result = await Swal.fire({
                        title: "Logout?",
                        text: "Are you sure you want to logout?",
                        icon: "warning",
                        showCancelButton: true,
                        confirmButtonText: "Yes, Logout",
                        cancelButtonText: "Cancel",
                        reverseButtons: true
                    });
                    if (!result.isConfirmed) {
                        return;
                    }
                    try {
                        const response = await fetch("/api/auth/logout", {
                            method: "POST",
                            credentials: "same-origin"
                        });

                        if (!response.ok) {
                            throw new Error("Logout failed");
                        }

                        await Swal.fire({
                            icon: "success",
                            title: "Logged out",
                            text: "You have been logged out successfully.",
                            timer: 1200,
                            showConfirmButton: false
                        });

                        // Logout ke baad Home page
                        window.location.href = "/";
                    } catch (error) {
                        console.error("Logout error:", error);
                        Swal.fire({
                            icon: "error",
                            title: "Logout failed",
                            text: "Something went wrong. Please try again."
                        });
                    }
                });
            });
        </script>
    </aside>
</body>
</html>
