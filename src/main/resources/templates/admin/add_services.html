<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: adminLayout(~{::section}, ~{::title})}">
    <head>
        <title>Manage Services - Sanitization Management System</title>
    </head>
    <body>
        <section>
            <!-- PAGE HEADER -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Manage Services</h1>
                    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Manage sanitization services, prices and images.</p>
                </div>
                <button type="button" onclick="openAddServiceModal()"
                    class="inline-flex items-center justify-center gap-2
                           px-4 py-2.5 text-sm font-medium text-white
                           bg-blue-600 rounded-lg hover:bg-blue-700
                           focus:ring-4 focus:ring-blue-300 transition">
                    <i class="fa-solid fa-plus"></i>Add New Service
                </button>
            </div>

            <!-- TABLE CARD -->
            <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm overflow-hidden">
                <!-- TABLE TOP -->
                <div class="p-4 sm:p-5 border-b border-gray-200 dark:border-gray-700">
                    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                        <!-- ACTIONS -->
                        <div class="flex flex-wrap gap-2">
                            <button type="button" onclick="copyServices()" class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-600">
                                <i class="fa-regular fa-copy"></i>Copy
                            </button>
                            <button type="button" onclick="exportServices()"
                                class="inline-flex items-center gap-2
                                    px-3 py-2 text-sm font-medium
                                    text-gray-700 bg-gray-100 rounded-lg
                                    hover:bg-gray-200
                                    dark:bg-gray-700 dark:text-gray-200
                                    dark:hover:bg-gray-600">
                                <i class="fa-solid fa-file-export"></i>Export
                            </button>
                        </div>

                        <!-- LIVE SEARCH -->
                        <div class="w-full lg:w-72">
                            <div class="relative">
                                <div class="absolute inset-y-0 start-0
                                    flex items-center ps-3
                                    pointer-events-none">
                                    <i class="fa-solid fa-magnifying-glass
                                      text-gray-400"></i>
                                </div>
                                <input type="text" id="serviceSearch" autocomplete="off" placeholder="Search services..."
                                       class="block w-full p-2.5 ps-10
                                              text-sm text-gray-900
                                              border border-gray-300
                                              rounded-lg bg-gray-50
                                              focus:ring-blue-500
                                              focus:border-blue-500
                                              dark:bg-gray-700
                                              dark:border-gray-600
                                              dark:placeholder-gray-400
                                              dark:text-white">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TABLE -->
                <div class="relative overflow-x-auto">
                    <table class="w-full text-sm text-left
                          text-gray-500 dark:text-gray-400">
                        <thead class="text-xs text-gray-700 uppercase
                              bg-gray-100 dark:bg-gray-700
                              dark:text-gray-300">
                            <tr>
                                <th class="px-6 py-4">S No.</th>
                                <th class="px-6 py-4">Service</th>
                                <th class="px-6 py-4">Price</th>
                                <th class="px-6 py-4">Status</th>
                                <th class="px-6 py-4">Creation Date</th>
                                <th class="px-6 py-4">Action</th>
                            </tr>
                        </thead>

                        <tbody id="servicesTableBody">
                            <tr>
                                <td colspan="6" class="px-6 py-10 text-center">
                                    <div class="flex justify-center">
                                        <div class="w-8 h-8 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
                                    </div>
                                    <p class="mt-3 text-gray-500 dark:text-gray-400">Loading services...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- ENTRY INFO -->
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 p-4">
                    <span id="serviceEntryInfo" class="text-sm text-gray-500 dark:text-gray-400">Showing 0 to 0 of 0 entries</span>
                </div>
            </div>

            <!-- ADD SERVICE MODAL -->
            <div id="add-service-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/50 p-4">
                <div class="relative w-full max-w-lg max-h-[90vh] overflow-y-auto">
                    <div class="relative bg-white rounded-xl shadow-xl dark:bg-gray-800">
                        <div class="flex items-center justify-between p-5 border-b border-gray-200 dark:border-gray-700"><div>
                        <h3 class="text-xl font-semibold text-gray-900 dark:text-white">Add New Service</h3>
                        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Add a new sanitization service.</p>
                    </div>

                    <button type="button" onclick="closeAddServiceModal()"
                            class="w-8 h-8 flex items-center
                                   justify-center rounded-lg
                                   text-gray-400 hover:bg-gray-100
                                   hover:text-gray-900
                                   dark:hover:bg-gray-700
                                   dark:hover:text-white">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <form id="addServiceForm">
                    <div class="p-5 space-y-5">
                        <div>
                            <label for="serviceTitle" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                                Service Title
                                <span class="text-red-500">*</span>
                            </label>

                            <input type="text" id="serviceTitle" required maxlength="100" placeholder="e.g. Home Sanitization"
                                   class="w-full px-4 py-2.5 text-sm
                                          border border-gray-300 rounded-lg
                                          bg-gray-50 text-gray-900
                                          focus:ring-blue-500
                                          focus:border-blue-500
                                          dark:bg-gray-700
                                          dark:border-gray-600
                                          dark:text-white">
                        </div>

                        <div>
                            <label for="servicePrice" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Service Price
                                <span class="text-red-500">*</span>
                            </label>
                            <input type="number" id="servicePrice" required min="0" step="0.01" placeholder="Enter price"
                                   class="w-full px-4 py-2.5 text-sm
                                          border border-gray-300 rounded-lg
                                          bg-gray-50 text-gray-900
                                          focus:ring-blue-500
                                          focus:border-blue-500
                                          dark:bg-gray-700
                                          dark:border-gray-600
                                          dark:text-white">
                        </div>

                        <div>
                            <label for="serviceDescription" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Description</label>
                            <textarea id="serviceDescription" rows="4" maxlength="500" placeholder="Enter service description"
                                      class="w-full px-4 py-2.5 text-sm
                                             border border-gray-300 rounded-lg
                                             bg-gray-50 text-gray-900
                                             focus:ring-blue-500
                                             focus:border-blue-500
                                             dark:bg-gray-700
                                             dark:border-gray-600
                                             dark:text-white">
                            </textarea>
                        </div>

                        <!-- IMAGE -->
                        <div>
                            <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Service Image
                                <span class="text-gray-400 font-normal">(Optional)</span>
                            </label>
                            <label for="serviceImage"
                                   class="flex flex-col items-center
                                          justify-center w-full h-44
                                          border-2 border-dashed
                                          border-gray-300 dark:border-gray-600
                                          rounded-xl cursor-pointer
                                          bg-gray-50 hover:bg-gray-100
                                          dark:bg-gray-700/50
                                          dark:hover:bg-gray-700">
                                <div class="flex flex-col items-center justify-center px-4 text-center">
                                    <i class="fa-solid fa-cloud-arrow-up text-4xl text-blue-500 mb-3"></i>
                                    <p class="mb-1 text-sm text-gray-600 dark:text-gray-300">
                                        <span class="font-semibold">Click to upload</span>or drag and drop
                                    </p>

                                    <p class="text-xs text-gray-500 dark:text-gray-400">PNG, JPG, JPEG, WEBP, GIF, BMP, SVG, AVIF, TIFF</p>
                                    <p id="imageFileName" class="mt-2 text-xs font-medium text-blue-600 dark:text-blue-400"></p>
                                </div>

                                <input type="file" id="serviceImage" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/svg+xml,image/avif,image/tiff" class="hidden">
                            </label>

                            <div id="imagePreviewContainer" class="hidden mt-4">
                                <div class="relative w-full rounded-xl overflow-hidden border border-gray-200 dark:border-gray-700">
                                    <img id="imagePreview" src="" alt="Service image preview" class="w-full h-48 object-cover">
                                    <button type="button" id="removeImageBtn"
                                            class="absolute top-3 right-3
                                                   w-9 h-9 flex items-center
                                                   justify-center rounded-full
                                                   bg-red-600 text-white
                                                   hover:bg-red-700 shadow-lg">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-end gap-3 p-5 border-t border-gray-200 dark:border-gray-700">
                        <button type="button" onclick="closeAddServiceModal()" class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-200">
                            Cancel
                        </button>
                        <button type="submit" id="addServiceSubmit" class="px-5 py-2.5 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700">
                            <i class="fa-solid fa-plus me-1"></i>
                            Add Service
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- EDIT SERVICE MODAL -->
    <div id="edit-service-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/50 p-4">
        <div class="relative w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <div class="relative bg-white rounded-xl shadow-xl dark:bg-gray-800">
                <div class="flex items-center justify-between p-5 border-b border-gray-200 dark:border-gray-700">
                    <div>
                        <h3 class="text-xl font-semibold text-gray-900 dark:text-white">Edit Service</h3>
                        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Update service information.</p>
                    </div>
                    <button type="button" onclick="closeEditServiceModal()" class="w-8 h-8 flex items-center justify-center rounded-lg text-gray-400 hover:bg-gray-100 hover:text-gray-900 dark:hover:bg-gray-700 dark:hover:text-white">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <form id="editServiceForm">
                    <input type="hidden" id="editServiceId">
                    <div class="p-5 space-y-5">
                        <div>
                            <label for="editServiceTitle" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Service Title
                                <span class="text-red-500">*</span>
                            </label>

                            <input type="text" id="editServiceTitle" required maxlength="100"
                                   class="w-full px-4 py-2.5 text-sm
                                          border border-gray-300 rounded-lg
                                          bg-gray-50 text-gray-900
                                          focus:ring-blue-500
                                          focus:border-blue-500
                                          dark:bg-gray-700
                                          dark:border-gray-600
                                          dark:text-white">
                        </div>

                        <div>
                            <label for="editServicePrice" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                                Service Price
                                <span class="text-red-500">*</span>
                            </label>
                            <input type="number" id="editServicePrice" required min="0" step="0.01"
                                   class="w-full px-4 py-2.5 text-sm
                                          border border-gray-300 rounded-lg
                                          bg-gray-50 text-gray-900
                                          focus:ring-blue-500
                                          focus:border-blue-500
                                          dark:bg-gray-700
                                          dark:border-gray-600
                                          dark:text-white">
                        </div>

                        <div>
                            <label for="editServiceDescription" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                                Description
                            </label>
                            <textarea id="editServiceDescription" rows="4" maxlength="500"
                                      class="w-full px-4 py-2.5 text-sm
                                             border border-gray-300 rounded-lg
                                             bg-gray-50 text-gray-900
                                             focus:ring-blue-500
                                             focus:border-blue-500
                                             dark:bg-gray-700
                                             dark:border-gray-600
                                             dark:text-white">
                            </textarea>
                        </div>

                        <div>
                            <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                                Service Image
                            </label>
                            <div id="editCurrentImageContainer" class="hidden mb-3">
                                <p class="text-xs text-gray-500 dark:text-gray-400 mb-2">Current Image</p>
                                <img id="editCurrentImage" src="" alt="Current service image" class="w-full h-40 object-cover rounded-xl border border-gray-200 dark:border-gray-700">
                            </div>

                            <label for="editServiceImage"
                                   class="flex flex-col items-center
                                          justify-center w-full h-40
                                          border-2 border-dashed
                                          border-gray-300 dark:border-gray-600
                                          rounded-xl cursor-pointer
                                          bg-gray-50 hover:bg-gray-100
                                          dark:bg-gray-700/50
                                          dark:hover:bg-gray-700">

                                <div class="flex flex-col items-center justify-center px-4 text-center">
                                    <i class="fa-solid fa-image text-3xl text-blue-500 mb-3"></i>
                                    <p class="mb-1 text-sm text-gray-600 dark:text-gray-300">
                                        <span class="font-semibold">Choose new image</span>
                                    </p>
                                    <p class="text-xs text-gray-500 dark:text-gray-400">
                                        Leave empty to keep current image
                                    </p>
                                    <p id="editImageFileName" class="mt-2 text-xs font-medium text-blue-600 dark:text-blue-400"></p>
                                </div>

                                <input type="file" id="editServiceImage"
                                       accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/svg+xml,image/avif,image/tiff"
                                       class="hidden">
                            </label>

                            <div id="editImagePreviewContainer" class="hidden mt-4">
                                <div class="relative w-full rounded-xl overflow-hidden border border-gray-200 dark:border-gray-700">
                                    <img id="editImagePreview" src="" alt="New image preview" class="w-full h-40 object-cover">
                                    <button type="button" id="removeEditImageBtn"
                                            class="absolute top-3 right-3
                                                   w-9 h-9 flex items-center
                                                   justify-center rounded-full
                                                   bg-red-600 text-white
                                                   hover:bg-red-700 shadow-lg">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center">
                            <input type="checkbox" id="editServiceActive" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500">
                            <label for="editServiceActive" class="ms-2 text-sm font-medium text-gray-900 dark:text-gray-300">
                                Active Service
                            </label>
                        </div>
                    </div>
                    <div class="flex items-center justify-end gap-3 p-5 border-t border-gray-200 dark:border-gray-700">
                        <button type="button" onclick="closeEditServiceModal()"
                                class="px-5 py-2.5 text-sm font-medium
                                       text-gray-700 bg-gray-100 rounded-lg
                                       hover:bg-gray-200
                                       dark:bg-gray-700
                                       dark:text-gray-200">
                            Cancel
                        </button>
                        <button type="submit" id="editServiceSubmit" class="px-5 py-2.5 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700">
                            <i class="fa-solid fa-floppy-disk me-1"></i>
                            Update Service
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script th:src="@{/js/admin-services.js}"></script>
</section>
</body>
</html>
