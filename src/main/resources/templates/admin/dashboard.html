<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: adminLayout(~{::section},~{::title})}">
    <head>
        <title>Admin Dashboard</title>
    </head>
    <body>
        <section>
            <div class="p-4 sm:p-6 lg:p-8">
                <!-- ================= HEADER ================= -->
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white">Dashboard</h1>
                        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Sanitization Management System overview.</p>
                    </div>

                    <button id="refreshDashboardBtn" type="button" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium transition">
                        <i class="fa-solid fa-rotate-right"></i>
                        Refresh
                    </button>
                </div>

                <!-- ================= STAT CARDS ================= -->
                <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-5">
                    <!-- TOTAL REQUESTS -->
                    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5 shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500 dark:text-gray-400">Total Requests</p>
                                <h2 id="totalRequests" class="mt-2 text-3xl font-bold text-gray-900 dark:text-white">0</h2>
                            </div>

                            <div class="w-12 h-12 rounded-lg bg-blue-100 dark:bg-blue-900/40 flex items-center justify-center">
                                <i class="fa-solid fa-file-lines text-blue-600 dark:text-blue-400 text-xl"></i>
                            </div>
                        </div>
                    </div>

                    <!-- PENDING -->
                    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5 shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500 dark:text-gray-400">Pending</p>
                                <h2 id="pendingRequests" class="mt-2 text-3xl font-bold text-gray-900 dark:text-white">0</h2>
                            </div>

                            <div class="w-12 h-12 rounded-lg bg-yellow-100 dark:bg-yellow-900/40 flex items-center justify-center">
                                <i class="fa-solid fa-clock text-yellow-600  dark:text-yellow-400 text-xl"></i>
                            </div>
                        </div>
                    </div>

                    <!-- COMPLETED -->
                    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5 shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500 dark:text-gray-400">Completed</p>
                                <h2 id="completedRequests" class="mt-2 text-3xl font-bold text-gray-900 dark:text-white">0</h2>
                            </div>

                            <div class="w-12 h-12 rounded-lg bg-green-100 dark:bg-green-900/40 flex items-center justify-center">
                                <i class="fa-solid fa-circle-check text-green-600 dark:text-green-400 text-xl"></i>
                            </div>
                        </div>
                    </div>

                    <!-- CANCELLED -->
                    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5 shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500 dark:text-gray-400">Cancelled</p>
                                <h2 id="cancelledRequests" class="mt-2 text-3xl font-bold text-gray-900 dark:text-white">0</h2>
                            </div>

                        <div class="w-12 h-12 rounded-lg bg-red-100 dark:bg-red-900/40 flex items-center justify-center">
                            <i class="fa-solid fa-circle-xmark text-red-600 dark:text-red-400 text-xl"></i>
                        </div>
                </div>
            </div>
        </div>

        <!-- ================= RECENT REQUESTS ================= -->
        <div class="mt-6 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm overflow-hidden">
            <!-- SECTION HEADER -->
            <div class="flex items-center justify-between p-5 border-b border-gray-200 dark:border-gray-700">
                <div>
                    <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Recent Requests</h2>
                    <p id="recentRequestCount" class="mt-1 text-xs text-gray-500 dark:text-gray-400">Loading...</p>
                </div>
                <a href="/admin/requests" class="text-sm font-medium text-blue-600 dark:text-blue-400 hover:underline">View All</a>
            </div>

            <!-- ================= LOADING ================= -->
            <div id="dashboardLoading" class="py-12 text-center">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-blue-600"></i>
                <p class="mt-3 text-sm text-gray-500 dark:text-gray-400">Loading dashboard...</p>
            </div>

            <!-- ================= EMPTY ================= -->
            <div id="dashboardEmpty" class="hidden py-12 text-center">
                <i class="fa-solid fa-inbox text-3xl text-gray-400"></i>
                <p class="mt-3 font-medium text-gray-700 dark:text-gray-200">No requests found</p>
            </div>

            <!-- ================= TABLE ================= -->
            <div id="recentRequestsContainer" class="hidden overflow-x-auto">
                <table class="w-full min-w-[700px] text-sm text-left">
                    <thead class="bg-gray-50 dark:bg-gray-700">
                        <tr class="text-xs uppercase text-gray-500 dark:text-gray-300">
                            <th class="px-5 py-3">Tracking ID</th>
                            <th class="px-5 py-3">Customer</th>
                            <th class="px-5 py-3">Service</th>
                            <th class="px-5 py-3">Date</th>
                            <th class="px-5 py-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="recentRequestsBody" class="divide-y divide-gray-200 dark:divide-gray-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ================= DASHBOARD JS ================= -->
    <script th:src="@{/js/admin-dashboard.js}"></script>
</section>
</body>
</html>
